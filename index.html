<style>
/* Layout: eye-level walk-in 3D store filling the screen; brand bar on top, detail sheet floating, aisle chips at the bottom. One bright retail look in iBrand pink by choice. */
:root{
  --pink:#e873a8;
  --pink-deep:#c9518b;
  --pink-soft:#fbe6f0;
  --plum:#3b1d36;
  --muted:#7b6274;
  --paper:#ffffff;
  --ground:#f7f2f5;
  --line:#efd9e4;
  --font:"Almarai", Tahoma, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--plum);font-family:var(--font);overflow:hidden;direction:rtl}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}

.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 12px;box-shadow:0 8px 24px rgba(59,29,54,.10)}
.logo{font-weight:800;font-size:19px;color:var(--pink);letter-spacing:0;line-height:1}
.logo small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:4px}
.store-link{pointer-events:auto;font-weight:700;font-size:13px;color:#fff;background:var(--pink);text-decoration:none;border-radius:12px;padding:11px 15px;white-space:nowrap;box-shadow:0 8px 20px rgba(232,115,168,.35)}
:is(.store-link,.chip,.cta,.close,.panel a):focus-visible{outline:3px solid var(--plum);outline-offset:2px}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);
  background:rgba(59,29,54,.82);color:#fff;font-size:13px;border-radius:999px;padding:9px 16px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}

.aisles{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:18px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(to top, rgba(247,242,245,.97) 50%, rgba(247,242,245,0))}
.aisles .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.aisles .row::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--plum);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.chip.offer{color:var(--pink-deep);background:var(--pink-soft);border-color:#f5c6dc}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}

.panel[hidden]{display:none}
.panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 78px);left:max(16px, env(safe-area-inset-left,0px));width:min(360px, calc(100% - 32px));
  max-height:calc(100% - 210px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 22px 60px rgba(59,29,54,.20);padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px}
.panel .eyebrow{font-size:12px;font-weight:700;color:var(--pink-deep)}
.panel h2{font-size:24px;font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.8;color:var(--muted);font-size:14.5px}
.panel ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.panel ol a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--plum);font-size:14px;line-height:1.55;padding:10px 11px;border-radius:10px;background:var(--ground)}
.panel ol a:hover{background:var(--pink-soft)}
.panel ol a em{font-style:normal;font-weight:800;color:var(--pink);font-variant-numeric:tabular-nums;min-width:1.2em}
.panel .pimg{width:100%;height:190px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.price{font-weight:800;font-size:21px;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:400;font-size:14px;margin-inline-start:8px}
.sub{text-align:center;color:var(--plum);font-weight:700;font-size:14px;text-decoration:none;padding:6px}
.sub:hover{color:var(--pink-deep)}
.tip{position:fixed;z-index:7;pointer-events:none;max-width:260px;background:rgba(59,29,54,.9);color:#fff;font-size:12.5px;line-height:1.5;border-radius:10px;padding:7px 10px;transform:translate(-50%, calc(-100% - 14px))}
.tip b{display:block;color:#ffd3e7;font-variant-numeric:tabular-nums}
.cta{text-align:center;font-weight:700;font-size:15px;color:#fff;background:var(--pink);text-decoration:none;border-radius:12px;padding:14px 16px}
.cta:hover{background:var(--pink-deep)}
.close{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--plum);font-size:18px;cursor:pointer;line-height:1}

.loading{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:var(--ground);color:var(--pink-deep);font-weight:700;font-size:16px;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.fallback{position:fixed;inset:0;z-index:9;overflow:auto;background:var(--ground);padding-block:90px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.fallback a{display:block;padding:12px 14px;margin-block:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;color:var(--plum);text-decoration:none;font-weight:700}

@media (max-width:640px){
  .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));width:auto;max-height:50%}

  .hint{font-size:12px}

const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSmall = Math.min(innerWidth, innerHeight) < 700;
let DATA = null;

function showFallback(){
  const f = document.createElement('div'); f.className='fallback';
  f.innerHTML = '<h2>أقسام صيدلية اي براند</h2><p>جهازك لا يدعم العرض ثلاثي الأبعاد، تقدر تتسوق الأقسام مباشرة:</p>';
  SECTIONS.filter(s=>s.key!=='best').forEach(s=>{const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=s.name;f.appendChild(a)});
  document.body.appendChild(f); $('#loading').classList.add('done');
}

(async function boot(){
  if (!window.THREE || !THREE.OrbitControls) return showFallback();
  try { await Promise.race([Promise.all([document.fonts.load('800 80px "Almarai"'), document.fonts.load('400 40px "Almarai"')]), new Promise(r=>setTimeout(r,2500))]); } catch(e){}
  let renderer;
  try { renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'}); } catch(e){ return showFallback(); }
  try { const r = await fetch('data/products.json', {cache:'no-cache'}); if (r.ok) DATA = await r.json(); } catch(e){}
  try { build(renderer); } catch(e){ console.error(e); showFallback(); }
})();

function build(renderer){
  const stage = $('#stage');
  renderer.setPixelRatio(Math.min(devicePixelRatio, isSmall ? 1.5 : 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.88;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#f6eef2');
  if (THREE.RoomEnvironment){
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  }

  const camera = new THREE.PerspectiveCamera(58, stage.clientWidth/stage.clientHeight, 0.05, 80);
  const HOME = {pos:new THREE.Vector3(0, 2.75, 12.9), target:new THREE.Vector3(0, 1.25, -1)};
  camera.position.copy(HOME.pos);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME.target);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 1.2; controls.maxDistance = 13;
  controls.minPolarAngle = Math.PI*0.28; controls.maxPolarAngle = Math.PI*0.56;
  controls.rotateSpeed = 0.55; controls.panSpeed = 0.8; controls.screenSpacePanning = false;

  const ROOM = {x:13, zBack:-16, zFront:13.4, h:4.4};

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight('#ffffff', '#e2d2db', 0.35));
  const key = new THREE.DirectionalLight('#fff6ee', 0.9);
  key.position.set(5, 14, 6); key.castShadow = true;
  key.shadow.mapSize.set(isSmall?1024:2048, isSmall?1024:2048);
  Object.assign(key.shadow.camera, {left:-15, right:15, top:17, bottom:-17, near:1, far:40});
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
  scene.add(key);
  const pinkGlow = new THREE.PointLight(PINK, 0.6, 14, 2); pinkGlow.position.set(0, 3.6, -13.5); scene.add(pinkGlow);

  // ---------- helpers ----------
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const sRGB = t => (t.encoding = THREE.sRGBEncoding, t.anisotropy = aniso, t);
  const std = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.6, metalness:0, envMapIntensity:.7}, o));
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const pickOne = a => a[(Math.random()*a.length)|0];

  function pharmacyCounter(sec){
    const g = new THREE.Group();
    const wall = gondola(sec, 11, 2.25, .5); wall.g.position.z = -2.75; g.add(wall.g);
    const body = new THREE.Mesh(new THREE.BoxGeometry(8, 1.0, .9), std('#ffffff',{roughness:.25})); body.position.set(0,.5,0); g.add(body);
    const front = new THREE.Mesh(new THREE.BoxGeometry(8.02, .5, .02), pinkMat); front.position.set(0,.45,.451); g.add(front);
    const ctop = new THREE.Mesh(new THREE.BoxGeometry(8.2,.05,1.05), std('#efe9ec',{roughness:.12, metalness:.05, envMapIntensity:1})); ctop.position.set(0,1.025,0); g.add(ctop);
    // POS screens
    [-2.2, 2.2].forEach(x=>{ const st=new THREE.Mesh(new THREE.BoxGeometry(.06,.25,.06), steelMat); st.position.set(x,1.17,-.15); g.add(st); const sc=new THREE.Mesh(new THREE.BoxGeometry(.42,.28,.03), std('#1b1b1f',{roughness:.2})); sc.position.set(x,1.38,-.15); sc.rotation.x=-.2; g.add(sc); });
    addShadow(g);
    // brand wall
    const brandT = canvasTex(1024, 256, (x,W,H)=>{ x.clearRect(0,0,W,H); x.fillStyle=PINK; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl'; x.font='800 150px "Almarai", Tahoma'; x.fillText('اي براند', W/2, H/2+8); });
    const brand = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.05), new THREE.MeshBasicMaterial({map:brandT, transparent:true, toneMapped:false})); brand.position.set(-1.2, 3.45, -3.0); g.add(brand);
    const crossMat = new THREE.MeshBasicMaterial({color:'#20c27a', toneMapped:false});
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(.28,.84,.08), crossMat), c2 = new THREE.Mesh(new THREE.BoxGeometry(.84,.28,.08), crossMat);
    [c1,c2].forEach(c=>{ c.position.set(2.15, 3.45, -2.98); g.add(c); });
    g.userData.cross = crossMat;
    return {g, sign: wall.sign};
  }

  const place = (o, x, z, ry=0) => { o.g.position.set(x,0,z); o.g.rotation.y = ry; scene.add(o.g); return o; };
  const sideZ = [-11.2, -5.4, .4, 6.2]; const promoX = [-7.6,-2.9,2.9,7.6];
  let li=0, ri=0, pi=0;
  SECTIONS.forEach(sec=>{
    let o; const k = sec.zone;
    if (k==='left')    o = place(gondola(sec, 5.3), -(ROOM.x-.3), sideZ[li++],  Math.PI/2);
    if (k==='right')   o = place(gondola(sec, 5.3),  (ROOM.x-.3), sideZ[ri++], -Math.PI/2);
    if (k==='center')  o = place(gondola(sec, 7, 1.7), 0, -6.6, 0);
    if (k==='promo')   o = place(promoIsland(sec), promoX[pi++], 7.4, 0);
    if (k==='best')    o = place(bestStand(sec), 0, 1.6, 0);
    if (k==='counter') o = place(pharmacyCounter(sec), 0, -12.9, 0);
    const n = new THREE.Vector3(0,0,1).applyQuaternion(o.g.quaternion), t = o.g.position.clone();
    let dist=4.4, ty=1.25, cy=.45;
    if (k==='promo'){ dist=4; ty=1.0; cy=.95; }
    if (k==='best'){ dist=4.4; ty=1.1; cy=.9; }
    if (k==='counter'){ t.z -= 1.6; dist=7; ty=2.1; cy=.1; }
    if (k==='center'){ dist=4.2; ty=1.0; cy=.8; }
    t.y = ty; sec.focus = {target:t, pos:t.clone().addScaledVector(n, dist).add(new THREE.Vector3(0,cy,0))};
    o.g.traverse(m=>{ m.userData.sec = sec; });
    clickables.push({root:o.g, sec, sign:o.sign});
  });

  // ---------- UI ----------
  const chips = $('#chips'), chipEls = {};
  SECTIONS.forEach(sec=>{
    const b = document.createElement('button'); b.className = 'chip' + (sec.offer ? ' offer' : ''); b.type='button';
    b.textContent = sec.name; b.setAttribute('aria-pressed','false');
    b.addEventListener('click', ()=>select(sec, true)); chips.appendChild(b); chipEls[sec.key]=b;
  });
  const panel = $('#panel');
  function select(sec, fromChip){
    hideHint();
    $('#pEyebrow').textContent = sec.eyebrow || 'قسم';
    $('#pName').textContent = sec.name; $('#pDesc').textContent = sec.desc; $('#pDesc').hidden = false;
    $('#pImg').hidden = true; $('#pPrice').hidden = true; $('#pSub').hidden = true;
    const list = $('#pList'); list.innerHTML='';
    if (sec.products){
      sec.products.forEach(([id,name],i)=>{ const li=document.createElement('li'), a=document.createElement('a');
        a.href = STORE + '?product_id=' + id; a.target='_blank'; a.rel='noopener';
        a.innerHTML = `<em>${i+1}</em>`; a.appendChild(document.createTextNode(name)); li.appendChild(a); list.appendChild(li); });
      list.hidden = false; $('#pCta').href = 'https://ibrand.com.sa'; $('#pCta').textContent = 'تصفح المتجر كاملاً ←';
    } else { list.hidden = true; $('#pCta').href = sec.url; $('#pCta').textContent = 'تسوّق ' + sec.name + ' ←'; }
    panel.hidden = false; panel.scrollTop = 0;
    Object.entries(chipEls).forEach(([k,el])=>el.setAttribute('aria-pressed', k===sec.key ? 'true':'false'));
    if (fromChip) chipEls[sec.key].scrollIntoView({behavior: reduceMotion?'auto':'smooth', inline:'center', block:'nearest'});
    flyTo(sec.focus.pos, sec.focus.target);
  }
  const money = v => (Math.round(v*100)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ر.س';
  function selectProduct(hit){
    const {sec, prod} = hit; hideHint();
    $('#pEyebrow').textContent = sec.name;
    $('#pName').textContent = prod.name;
    const img = $('#pImg'); img.src = prod.img; img.alt = prod.name; img.hidden = false;
    const pr = $('#pPrice');
    if (typeof prod.price === 'number'){ pr.innerHTML = ''; pr.append(money(prod.price)); if (prod.onSale && prod.regular > prod.price){ const st=document.createElement('s'); st.textContent = money(prod.regular); pr.append(st); } pr.hidden = false; } else pr.hidden = true;
    $('#pDesc').hidden = true; $('#pList').hidden = true;
    $('#pCta').href = prod.url; $('#pCta').textContent = 'اشترِ من المتجر ←';
    const sub = $('#pSub'); sub.href = sec.url; sub.textContent = 'تسوّق ' + sec.name; sub.hidden = sec.key === 'best';
    panel.hidden = false; panel.scrollTop = 0;
    Object.entries(chipEls).forEach(([k,el])=>el.setAttribute('aria-pressed', k===sec.key ? 'true':'false'));
    const n = hit.normal.clone(); n.y = 0; n.normalize();
    const target = hit.point.clone(), pos = target.clone().addScaledVector(n, 1.35); pos.y = target.y + .25;
    flyTo(pos, target);
  }
  $('#close').addEventListener('click', ()=>{ panel.hidden = true; Object.values(chipEls).forEach(el=>el.setAttribute('aria-pressed','false')); flyTo(HOME.pos, HOME.target); });
  addEventListener('keydown', e=>{ if (e.key==='Escape' && !panel.hidden) $('#close').click(); });
  let hintTimer = setTimeout(hideHint, 8000);
  function hideHint(){ clearTimeout(hintTimer); $('#hint').classList.add('gone'); }

  // ---------- camera ----------
  let flight = null;
  function flyTo(pos, target){
    if (reduceMotion){ camera.position.copy(pos); controls.target.copy(target); return; }
    flight = {p0:camera.position.clone(), t0:controls.target.clone(), p1:pos.clone(), t1:target.clone(), start:performance.now(), dur:1300};
  }
  const clampV = (v, pad) => { v.x = Math.max(-ROOM.x+pad, Math.min(ROOM.x-pad, v.x)); v.z = Math.max(ROOM.zBack+pad, Math.min(ROOM.zFront-.3, v.z)); v.y = Math.max(.6, Math.min(ROOM.h-.35, v.y)); };

  // ---------- picking ----------
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), roots = clickables.map(c=>c.root);
  function pick(ev){
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(roots, true)[0];
    if (!hit) return null;
    const o = hit.object, prod = o.userData.places && hit.faceIndex != null ? o.userData.places[hit.faceIndex >> 1] : null;
    return {sec:o.userData.sec, prod, point:hit.point, normal: hit.face ? hit.face.normal.clone().transformDirection(o.matrixWorld) : new THREE.Vector3(0,0,1)};
  }
  let down=null, hovered=null; const el = renderer.domElement;
  el.addEventListener('pointerdown', e=>{ down={x:e.clientX,y:e.clientY}; hideHint(); flight=null; el.style.cursor='grabbing'; });
  el.addEventListener('pointerup', e=>{ el.style.cursor = hovered ? 'pointer' : 'grab'; if (!down) return; const moved=Math.hypot(e.clientX-down.x, e.clientY-down.y); down=null; if (moved<7){ const h=pick(e); if (h && h.prod) selectProduct(h); else if (h) select(h.sec); } });
  el.addEventListener('pointermove', e=>{
    if (e.pointerType!=='mouse' || down) return;
    const h = pick(e), s = h && h.sec, tip = $('#tip');
    if (h && h.prod){ tip.innerHTML=''; tip.append(h.prod.name); if (typeof h.prod.price==='number'){ const b=document.createElement('b'); b.textContent=money(h.prod.price); tip.append(b); } tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; } else tip.hidden = true;
    if (s !== hovered){
      if (hovered) clickables.find(c=>c.sec===hovered).sign.scale.setScalar(1);
      hovered = s; el.style.cursor = s ? 'pointer' : 'grab';
      if (s) clickables.find(c=>c.sec===s).sign.scale.setScalar(1.06);
    }
  });
  addEventListener('resize', ()=>{ camera.aspect = stage.clientWidth/stage.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(stage.clientWidth, stage.clientHeight); });

  // ---------- loop ----------
  const spin = clickables.find(c=>c.sec.key==='best').root.userData.spin;
  const cross = clickables.find(c=>c.sec.key==='meds').root.userData.cross;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  renderer.setAnimationLoop(now=>{
    if (flight){
      const k = Math.min(1, (now-flight.start)/flight.dur), e = ease(k);
      camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e);
      if (k>=1) flight=null;
    }
    if (!reduceMotion){ spin.rotation.y = now*0.00035; const g=.82+.18*Math.sin(now*0.0025); cross.color.setRGB(.12*g, .76*g, .48*g); }
    controls.update();
    clampV(camera.position, .45); clampV(controls.target, .6);
    renderer.render(scene, camera);
  });
  requestAnimationFrame(()=>$('#loading').classList.add('done'));
}
</script>
