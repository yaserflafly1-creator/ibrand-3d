<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تحسين صور المنتجات</title>
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
/* the review of better pictures found for products whose picture is weak: the store's picture beside what was found,
   one tap to approve. A picture reaches Salla only from here, and only when approved. */
:root{--bg:#f7f2f6;--card:#fff;--line:#e6d7e2;--fg:#2a1b27;--muted:#75607a;--pink:#e0447f;--plum:#3b1d36;--ok:#1f9a55;--bad:#c21f2f;--warn:#b26a00;--font:'Almarai',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit}
a{color:var(--pink)}
.bar{position:sticky;top:0;z-index:5;background:var(--plum);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
.bar h1{font-size:18px;margin:0;font-weight:800}
.bar .sp{flex:1}
.btn{border:0;border-radius:10px;padding:8px 16px;background:var(--pink);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:#f1e8ef;color:var(--plum)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.sum b{font-size:22px;font-weight:800;color:var(--plum);font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:700;font-size:13.5px}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.confirm{background:#fff7e6;border:1px solid #f0d49a;border-radius:12px;padding:10px 14px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1;min-width:220px}
.item{display:grid;grid-template-columns:150px 28px 1fr;gap:12px;align-items:start}
.item h2{grid-column:1 / -1;font-size:15.5px;margin:0;font-weight:800;color:var(--plum)}
.meta{grid-column:1 / -1;color:var(--muted);font-size:12.5px;margin-top:-10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta .fl{color:var(--warn);font-weight:700}
.pic{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;text-align:center}
.pic img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.pic small{display:block;padding:4px 6px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{align-self:center;text-align:center;color:var(--muted);font-size:22px;font-weight:800}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,190px));gap:10px}
.cand{cursor:pointer;position:relative;border:2px solid var(--line);padding:0;background:#fff;border-radius:12px;overflow:hidden;text-align:center}
.cand.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(224,68,127,.18)}
.cand img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.cand small{display:block;padding:4px 6px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:6px;right:6px;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;color:#fff;background:var(--ok)}
.tag.mid{background:var(--warn)} .tag.low{background:#8a7a86}
.ord{position:absolute;top:6px;left:6px;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:800;color:#fff;background:var(--pink)}
.acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .st{font-size:13px;color:var(--muted)} .acts .st.good{color:var(--ok);font-weight:700} .acts .st.err{color:var(--bad);font-weight:700}
.item.done{opacity:.6}
details summary{cursor:pointer;font-weight:800;color:var(--plum)}
.none{columns:2 320px;margin:10px 0 0;padding:0 18px 0 0;font-size:13.5px}
.none li{break-inside:avoid;margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media (max-width:640px){ .item{grid-template-columns:1fr} .arrow{display:none} .item > .pic{max-width:170px} .cands{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="bar">
  <h1>تحسين صور المنتجات</h1>
  <span class="sp"></span>
  <a class="btn ghost" href="./">رجوع للوحة التحكم</a>
</div>
<main>
  <div class="card" id="gate" hidden><p style="margin:0">سجّل الدخول من <a href="./">لوحة التحكم</a> أولاً، ثم ارجع لهذه الصفحة.</p></div>
  <div class="card" id="top" hidden>
    <div class="sum" id="sum"></div>
    <div class="tools" id="filters"></div>
    <p style="margin:10px 0 0;font-size:13.5px;color:var(--muted)">اضغط على الصور التي تريد نشرها للمنتج (واحدة أو أكثر). أول صورة تختارها تكون الأساسية في سلة، والباقي صور إضافية. اضغط الصورة مرة ثانية لإلغاء اختيارها.</p>
    <div class="tools"><button class="btn ok" id="bulk" type="button"></button><span id="bulkSt" style="font-size:13px;color:var(--muted)"></span></div>
    <div class="confirm" id="confirm" hidden><p id="confirmTxt"></p><button class="btn ok" id="yes" type="button">تأكيد النشر</button><button class="btn ghost" id="no" type="button">إلغاء</button></div>
  </div>
  <div id="list"></div>
  <div class="card" id="noneBox" hidden><details><summary id="noneSum"></summary><ol class="none" id="none"></ol></details></div>
</main>
