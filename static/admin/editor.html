<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم مخطط الصيدلية والـ Planogram</title>
<style>
:root{--bg:#f4f5f7;--fg:#1d1d1f;--mut:#6b7280;--line:#e2e4e8;--card:#fff;--acc:#1565c0;--acc2:#e3f2fd;--bad:#c62828;--ok:#2e7d32}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;color:var(--fg);white-space:nowrap}
button:hover{background:#f1f3f5}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.pri:hover{background:#0d47a1}
button.dng{color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc2);border-color:#90caf9;color:#0d47a1}
input,select,textarea{padding:5px 7px;border:1px solid #cfd3d8;border-radius:6px;background:#fff;min-width:0;max-width:100%}
header{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{font-size:15px;margin:0 0 0 10px;white-space:nowrap}
.grp{display:flex;gap:4px;align-items:center;padding-inline-start:8px;border-inline-start:1px solid var(--line)}
.grp:first-of-type{border:0;padding:0}
#status{margin-inline-start:auto;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
#saveState{padding:3px 8px;border-radius:20px;background:#eceff1}
#saveState.dirty{background:#fff3cd;color:#8a6d00}
#saveState.ok{background:#e8f5e9;color:var(--ok)}
#saveState.err{background:#fdecea;color:var(--bad)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:#e9ebee}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
#map.panning{cursor:grabbing}
#map .fx{cursor:move}
#map .fx text{pointer-events:none}
.t{font-size:7px;fill:#111}.st{font-weight:700;fill:#fff}.lbl{font-size:11px;fill:#333}.sm{font-size:9px;fill:#888}.big{font-size:15px;font-weight:700}.zl{font-size:12px;font-weight:700}.aisle{font-size:14px;fill:#607d8b;font-weight:600}
#map .fx.sel .body{stroke:#111;stroke-width:1.6}
#map .fx.hit .body{stroke:#ffb300;stroke-width:2.4}
#map .fx.clash .body{stroke:#d50000;stroke-width:1.8;stroke-dasharray:3 2}
#map .fx.dim{opacity:.18}
#map .fx.drop .body{stroke:#00c853;stroke-width:3}
#map .fx:hover .body{stroke:#000;stroke-width:1.2}
.handle{fill:#fff;stroke:var(--acc);stroke-width:1.5;cursor:ns-resize}
.handle.h{cursor:ew-resize}
#marq{fill:rgba(21,101,192,.08);stroke:var(--acc);stroke-dasharray:4 3;stroke-width:1}
#hud{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px;color:var(--mut)}
#legend{position:absolute;top:8px;inset-inline-start:8px;inset-inline-end:8px;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:thin}
.chip{flex-shrink:0}
.chip{pointer-events:auto;display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 7px;font-size:11.5px;cursor:pointer}
.chip i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chip.off{opacity:.4}
.chip.solo{border-color:#111;font-weight:700}
#banner{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#fff8e1;border:1px solid #ffe082;border-radius:9px;padding:8px 12px;display:none;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.08);z-index:3}
aside{background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;border:0;border-radius:0;padding:9px 4px;border-bottom:2px solid transparent;background:none}
.tabs button.act{border-bottom-color:var(--acc);color:var(--acc);font-weight:700}
.pane{flex:1;overflow:auto;padding:12px;display:none;min-height:0}
.pane.act{display:block}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:13px;margin:14px 0 6px;color:#374151}
.meta{font-size:12px;color:var(--mut);line-height:1.7}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.9}
.form{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 8px;align-items:center}
.form label{color:var(--mut);font-size:12px}
.form .row2{display:flex;gap:6px}
.form .row2>*{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.kpi{background:#f6f7f9;border-radius:8px;padding:6px;text-align:center}
.kpi b{display:block;font-size:15px}
.kpi span{font-size:11px;color:var(--mut)}
.shelf{border:1px solid #c9ced4;border-bottom:4px solid #8d8d8d;background:#fff;margin-bottom:7px;border-radius:5px}
.sh{font-size:11.5px;background:#eceff1;padding:4px 6px;display:flex;gap:6px;align-items:center}
.sh.eye{background:#fff3cd}
.sh .nm{font-weight:700}
.sh .sp{flex:1}
.sh button{padding:1px 6px;font-size:11px}
.bar{height:4px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;background:#43a047}
.bar.over i{background:var(--bad)}
.items{display:flex;flex-wrap:wrap;gap:3px;padding:5px;min-height:34px}
#ctx{display:none;position:fixed;z-index:200;min-width:190px;background:#fff;border:1px solid #cfd8dc;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:5px;font-size:13px}
#ctx button{display:block;width:100%;text-align:start;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font:inherit;color:#263238}
#ctx button:hover:not(:disabled){background:#e3f2fd}
#ctx button:disabled{color:#b0bec5;cursor:default}
#ctx hr{border:0;border-top:1px solid #eceff1;margin:4px 0}
.items.over{background:#e8f5e9;outline:2px dashed #66bb6a;outline-offset:-3px}
.it{font-size:10.5px;border-radius:4px;padding:2px 5px;border:1px solid #ccc;background:#fdfdfd;max-width:200px;line-height:1.35;cursor:grab;position:relative}
.it b{display:block;font-weight:600}
.it.h{background:#e8f5e9;border-color:#66bb6a}
.it.z{background:#fbe9e7;border-color:#ef9a9a}
.it.mark{outline:2px solid #ffb300}
.it.ins{box-shadow:inset -3px 0 0 var(--acc)}
.it.dragging{opacity:.35}
.it .x{position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid #bbb;font-size:10px;line-height:13px;text-align:center;display:none;color:var(--bad)}
.it:hover .x{display:block}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
th{color:var(--mut);font-weight:600}
.res{padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;cursor:pointer}
.res:hover{background:#f6f9ff}
.res small{color:var(--mut)}
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(460px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.3)}
dialog .hd{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
dialog .bd{padding:14px}
dialog .ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
.menu{position:relative}
.menu .dd{position:absolute;top:110%;inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:5px;display:none;z-index:20;min-width:210px}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:right;border:0;margin:1px 0}
.kbd{font-size:11px;color:var(--mut);line-height:1.9}
.kbd kbd{background:#f1f3f5;border:1px solid #d6d9dd;border-radius:4px;padding:0 4px;font-family:inherit}
#loading{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut);z-index:100}
/* floor areas */
#lArea .area rect{stroke:none}
#map:not(.floorMode) #lArea{pointer-events:none}
#map.floorMode #lFx{pointer-events:none;opacity:.45}
#map.floorMode #lArea .area{cursor:move}
#map.floorMode #lArea .area rect{stroke:#455a64;stroke-dasharray:4 3;stroke-width:1}
#map.floorMode #lArea .area.asel rect{stroke:#1565c0;stroke-width:2;stroke-dasharray:none}
.alab{font-size:11px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
#floorBadge{position:absolute;top:44px;inset-inline-end:10px;background:#1565c0;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;display:none;z-index:2}
.sw{width:30px;height:24px;padding:0;border:1px solid #cfd3d8;border-radius:5px;cursor:pointer;background:none}
.swd{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.res.cur{border-color:#90caf9;background:#e3f2fd}
/* elevation (front view) */
#elev{position:absolute;inset-inline:0;bottom:0;height:56%;background:#fff;border-top:2px solid #90a4ae;box-shadow:0 -8px 24px rgba(0,0,0,.12);display:none;flex-direction:column;z-index:5}
#elev.full{height:100%}
#stage.eo #hud{display:none}
.ehd{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ehd .sp{flex:1}
#eLeg{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 10px;max-height:52px;overflow:auto;border-bottom:1px solid var(--line);font-size:11px}
#eLeg span{display:inline-flex;gap:4px;align-items:center}
#eLeg i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
#eBody{flex:1;overflow:auto;padding:12px;background:#eef1f4}
.gond{display:inline-block;min-width:max-content;background:#cfd8dc;border:6px solid #78909c;border-top-width:14px;border-radius:6px;padding:6px 8px 4px}
.erow{display:flex;align-items:stretch;margin-bottom:6px}
.erow.ehead{margin-bottom:2px}
.elab{width:104px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:11px;background:#eceff1;border-radius:5px;padding:4px 6px;margin-inline-end:8px;cursor:pointer;color:#455a64}
.elab:hover{background:#e3f2fd}
.elab b{font-size:12px;color:#263238}
.elab .bad{color:var(--bad);font-weight:700}
.erow.eye .elab{background:#fff3cd}
.erow.foc .elab{background:#bbdefb}
.ehead .elab{background:none;cursor:default}
.emods{display:flex}
.emods span{flex-shrink:0;text-align:center;font-size:10px;color:#546e7a;border-inline-start:1px solid #90a4ae}
.etrack.items{position:relative;display:flex;flex-wrap:nowrap;align-items:flex-end;gap:0;padding:0;min-height:0;border-bottom:7px solid #8d9ca6;
  background:repeating-linear-gradient(to left,#f8fafb 0,#f8fafb calc(var(--mod) - 1px),#c5cdd3 calc(var(--mod) - 1px),#c5cdd3 var(--mod));box-shadow:inset 0 6px 8px -6px rgba(0,0,0,.25)}
.etrack.curm{box-shadow:0 0 0 2px #1565c0,inset 0 6px 8px -6px rgba(0,0,0,.25)}
.etrack.ovf{outline:2px dashed var(--bad);outline-offset:2px}
.it.eb{flex-shrink:0;max-width:none;padding:0;border-radius:3px 3px 0 0;border:1px solid rgba(0,0,0,.3);line-height:1.15;overflow:hidden;
  background-image:linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:calc(100% / var(--f)) 100%;display:flex;flex-direction:column;justify-content:flex-end}
.it.eb:hover{filter:brightness(1.07);outline:2px solid #1565c0;z-index:2;overflow:visible}
.it.eb.z{border-color:#c62828;border-style:dashed}
.eb .en{display:block;font-size:9px;padding:2px 1px;overflow:hidden;color:#1a1a1a;word-break:break-word;flex:1;text-align:center}
.eb .en.v{writing-mode:vertical-rl;text-align:start;padding:3px 0}
.eb .ep{display:block;font-size:9px;font-weight:700;background:rgba(255,255,255,.75);text-align:center}
.foc .eb .en{font-size:11px}
.it.eb .x{top:2px;left:2px}
/* photo view */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px}
.seg button.on{background:var(--acc);color:#fff}
.gond.photo{background:#dfe4e8;border-color:#56636b}
.gond.photo .etrack.items{background:repeating-linear-gradient(to left,transparent 0,transparent calc(var(--mod) - 2px),#aab4bb calc(var(--mod) - 2px),#aab4bb var(--mod)),linear-gradient(#fafbfc,#eef1f3);
  border-bottom:10px solid #c3ccd2;box-shadow:inset 0 12px 14px -12px rgba(0,0,0,.35),0 3px 0 #8d9aa3}
.it.pb{flex-shrink:0;display:flex;align-items:flex-end;padding:0;border:0;background:none;max-width:none;border-radius:0;line-height:1;position:relative;font-size:8px}
.it.pb .fc{height:100%;overflow:hidden;position:relative;flex-shrink:0}
.it.pb .fc img{width:100%;height:100%;display:block;transform-origin:center;pointer-events:none}
.it.pb.noimg .fc{outline:1px dashed rgba(0,0,0,.28);outline-offset:-1px}
.ph{width:100%;height:100%;border-radius:3px 3px 1px 1px;background-image:linear-gradient(90deg,rgba(255,255,255,.45),transparent 45%,rgba(0,0,0,.1));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph span{writing-mode:vertical-rl;font-size:8px;color:#1a1a1a;opacity:.8;max-height:96%;overflow:hidden;line-height:1.1}
.it.pb:hover{outline:2px solid #1565c0;z-index:3}
.it.pb.fdrop{outline:3px solid #00c853;z-index:3}
.it .th{width:24px;height:24px;object-fit:contain;float:right;margin-inline-end:4px;background:#fff;border-radius:3px}
.imged{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start}
.ipv{width:170px;height:240px;background:linear-gradient(#fafbfc,#eef1f3);border-bottom:10px solid #c3ccd2;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;justify-content:center;gap:0;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.ipv .fc{overflow:hidden;flex-shrink:0;position:relative}
.ipv .fc img{width:100%;height:100%;display:block;pointer-events:none}
.ipdrop{border:2px dashed #b0bec5;border-radius:8px;padding:10px;text-align:center;color:var(--mut);font-size:12px;margin-bottom:8px;cursor:pointer}
.ipdrop.over{border-color:#00c853;background:#e8f5e9}
.bulk td{vertical-align:middle}
.bulk img{width:38px;height:38px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:55vh minmax(0,1fr)}aside{border-inline-start:0;border-top:1px solid var(--line)}header h1{display:none}}
</style>
</head>
<body>
<div id="loading">جاري تحميل المخطط…</div>
<header>
  <h1>🗺️ لوحة تحكم المخطط</h1>
  <div class="grp">
    <button id="bUndo" title="تراجع (Ctrl+Z)">↶ تراجع</button>
    <button id="bRedo" title="إعادة (Ctrl+Y)">↷ إعادة</button>
  </div>
  <div class="grp">
    <button id="bAdd" class="pri" title="إضافة ستاند جديد">＋ ستاند</button>
    <button id="bDup" title="نسخ الستاند المحدد بدون منتجات (Ctrl+D)">⧉ نسخ</button>
    <button id="bRot" title="تدوير 90° (R)">⟳ تدوير</button>
    <button id="bSplit" title="تقسيم الستاند (أو كل الستاندات) لستاندات 1 متر جنب بعض">✂️ تقسيم لمتر</button>
    <button id="bDel" class="dng" title="حذف (Delete)">🗑 حذف</button>
  </div>
  <div class="grp">
    <button id="bSnap" class="on" title="المحاذاة على شبكة 25 سم">🧲 محاذاة</button>
    <button id="bGrid" title="شبكة 1 متر">▦ شبكة</button>
    <button id="bBg" class="on" title="إظهار/إخفاء الخلفية">🖼 الخلفية</button>
    <button id="bFloor" title="تعديل الأرضيات: رسم مساحات ملوّنة على الأرض">✏️ الأرضيات</button>
  </div>
  <div class="grp menu" id="mFile">
    <button id="bFile">📁 ملف ▾</button>
    <div class="dd">
      <button data-a="json">⬇ تنزيل نسخة احتياطية (JSON)</button>
      <button data-a="csv">⬇ تصدير الـ Planogram (CSV / Excel)</button>
      <button data-a="svg">⬇ تصدير الرسم (SVG)</button>
      <button data-a="html">⬇ تنزيل نسخة HTML تشتغل أوفلاين</button>
      <hr style="border:0;border-top:1px solid var(--line)">
      <button data-a="import">⬆ استيراد نسخة JSON</button>
      <button data-a="bgimg">🖼 تغيير صورة الخلفية…</button>
      <button data-a="bgclear">✕ إزالة صورة الخلفية</button>
      <hr style="border:0;border-top:1px solid var(--line)">
      <button data-a="reset" class="dng">↺ استرجاع آخر نسخة محفوظة</button>
    </div>
  </div>
  <div id="status">
    <span id="tot"></span>
    <span id="saveState">—</span>
    <button id="bAuto" class="on" title="حفظ تلقائي بعد 8 ثواني من آخر تعديل">⟳ تلقائي</button>
    <button id="bSave" class="pri" title="حفظ (Ctrl+S)">💾 حفظ</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridP" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#90a4ae" stroke-width=".4"/></pattern>
      </defs>
      <g id="lImg"></g>
      <g id="lBg"></g>
      <g id="lArea"></g>
      <rect id="lGrid" x="0" y="0" fill="url(#gridP)" style="display:none;pointer-events:none"/>
      <g id="lFx"></g>
      <g id="lSel"></g>
      <rect id="marq" style="display:none"/>
    </svg>
    <div id="legend"></div>
    <div id="floorBadge">✏️ وضع تعديل الأرضيات — اسحب المساحات وغيّر حجمها من الأركان · <u style="cursor:pointer" id="fbExit">إنهاء</u></div>
    <div id="elev">
      <div class="ehd"><span class="seg"><button data-ev="plan" class="on">📐 الشكل</button><button data-ev="photo">📷 بالصور</button></span><b id="eTitle"></b><span class="sp"></span>
        <button id="eBulk" style="display:none" title="ارفع صور كتير مرة واحدة — بتتربط بالأصناف من اسم الملف">⬆ رفع صور</button>
        <label class="meta">التلوين <select id="eMode"><option value="auto">تلقائي</option><option value="brand">حسب البراند</option><option value="sub">حسب السب كاتيجوري</option><option value="ros">حسب المبيعات ROS</option><option value="stand">بلون الستاند</option></select></label>
        <label class="meta" style="display:flex;gap:4px;align-items:center">تكبير <input type="range" id="eZoom" min="1" max="8" step="0.25" value="1" style="width:90px"></label>
        <button id="eGrp" title="عرض أمتار المجموعة جنب بعض أو المتر ده بس">🔗 المجموعة</button>
        <button id="eAll">كل الرفوف</button>
        <button id="eSize" title="تكبير/تصغير اللوحة">⬍</button>
        <button id="eClose" title="إغلاق (Esc)">✕</button></div>
      <div id="eLeg"></div>
      <div id="eBody"></div>
    </div>

<script id="store">
/* =====================================================================
   PG_STORE — storage adapter. The editor reads and writes ONLY through
   this object. To use your own server, define window.PG_STORE in a
   <script> placed BEFORE this one (or replace this block). Interface:

     load()                 -> Promise<object>   the full state (see JSON format)
     save(data)             -> Promise<void>     data = deep-copied snapshot object
     saveImage(name, blob)  -> Promise<string>   store a product image, return a "ref"
     imageUrl(ref)          -> string            turn a stored ref into an <img src>
     init()      (optional) -> Promise           called once after the first load
     online      (optional) boolean; false = no server save (edits stay in the
                 browser + backup download). Missing/undefined = treated as true.

   save() may throw an Error with .code:
     'conflict'   -> someone saved a newer version
     'not_writer' / 'offline' -> switch the UI to "browser-only" saving
   Default behaviour below = how it works inside Claude (artifact files +
   asset uploads), falling back to data/state.json + data: URLs elsewhere.
   ===================================================================== */
window.PG_STORE = window.PG_STORE || (function(){
  var art = null, assets = null, ready = null;
  function use(n){
    try{ if(window.claude && window.claude.use) return Promise.resolve(window.claude.use(n)).catch(function(){return null}); }catch(e){}
    return Promise.resolve(null);
  }
  function blobToDataURL(b){ return new Promise(function(ok,err){ var r=new FileReader(); r.onload=function(){ok(r.result)}; r.onerror=err; r.readAsDataURL(b); }); }
  var store = {
    name: 'default',
    online: false,
    init: function(){
      if(!ready) ready = Promise.all([use('artifact'), use('assets')]).then(function(r){ art=r[0]; assets=r[1]; store.online = !!art; return store.online; });
      return ready;
    },
    load: async function(){
      var seed = document.getElementById('seed');                 // offline copy: data embedded in the page
      if(seed){ try{ return JSON.parse(seed.textContent); }catch(e){} }
      var r = await fetch('data/state.json', {cache:'no-store'});  // normal case: separate JSON file
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    },
    save: async function(data){
      await store.init();
      if(!art){ var e=new Error('no online storage'); e.code='offline'; throw e; }
      await art.publish({'data/state.json': {content: JSON.stringify(data), contentType:'application/json'}});
    },
    saveImage: async function(name, blob){
      await store.init();
      if(assets){ try{ var r = await assets.upload(blob); return r.url; }catch(e){ console.warn('image upload failed, embedding instead', e); } }
      return blobToDataURL(blob);                                  // fallback: image stored inside the JSON
    },
    imageUrl: function(ref){ return ref || ''; }
  };
  return store;
})();
</script>

/* ================= split into 1-meter stands / merge back ================= */
function splitFx(id){
  const f=S.fx[id];if(!f)return [];
  const segs=[];
  for(const p of f.parts){const v=isV(p),L=v?p.h:p.w,n=Math.max(1,Math.round(L/M)),u=L/n;
    for(let k=0;k<n;k++)segs.push(v?{x:p.x,y:r1(p.y+p.h-(k+1)*u),w:p.w,h:r1(u)}:{x:r1(p.x+p.w-(k+1)*u),y:p.y,w:r1(u),h:p.h})} // module 1 = far end
  const n=segs.length;if(n<2)return [];
  // per shelf: spread items evenly over the meters (in order), then rebalance any meter over 100 cm
  const bk=segs.map(()=>[]),byS={};
  for(const i of f.it)(byS[i[0]]=byS[i[0]]||[]).push(i);
  for(const its of Object.values(byS)){
    const tot=its.reduce((a,i)=>a+i[7],0),per=Math.max(1,tot/n),m=segs.map(()=>[]);let c=0;
    for(const i of its){m[Math.min(n-1,Math.floor((c+i[7]/2)/per))].push(i);c+=i[7]}
    const sum=a=>a.reduce((x,i)=>x+i[7],0);
    for(let k=0;k<n-1;k++)while(sum(m[k])>100&&m[k].length>1)m[k+1].unshift(m[k].pop());
    for(let k=n-1;k>0;k--)while(sum(m[k])>100&&m[k].length>1&&sum(m[k-1])+m[k][0][7]<=100)m[k-1].push(m[k].shift());
    if(m.some(a=>sum(a)>100)){ // order can't fit: first-fit-decreasing, keep original order inside each meter
      const idx=new Map(its.map((i,k)=>[i,k])),ff=segs.map(()=>[]),fs=segs.map(()=>0);let ok=true;
      for(const i of [...its].sort((a,b)=>b[7]-a[7])){let k=fs.findIndex(v=>v+i[7]<=100);if(k<0){ok=false;k=fs.indexOf(Math.min(...fs))}ff[k].push(i);fs[k]+=i[7]}
      if(ok||Math.max(...fs)<Math.max(...m.map(sum))){ff.forEach(a=>a.sort((x,y)=>idx.get(x)-idx.get(y)));ff.forEach((a,k)=>m[k]=a)}
    }
    m.forEach((a,k)=>bk[k].push(...a));
  }
  const codes=new Set(Object.values(S.fx).map(x=>x.code));
  const base=+nextId(),out=[],back=f.back||0,g=f.code,loc=(f.loc||'').replace(/ · متر \d+\/\d+$/,'');
  const {parts,it,...meta}=f;
  segs.forEach((r,k)=>{const nid=k===0?id:String(base+k-1);let code=`${g}-${k+1}`;while(codes.has(code)&&code!==f.code)code+="'";codes.add(code);
    S.fx[nid]={...clone(meta),code,modules:1,parts:[r],it:bk[k],back:Math.floor(back/n)+(k===0?back%n:0),loc:(loc?loc+' · ':'')+`متر ${k+1}/${n}`,grp:g,gi:k+1};out.push(nid)});
  return out;
}
function grpIds(g){return Object.keys(S.fx).filter(k=>S.fx[k].grp===g).sort((a,b)=>(S.fx[a].gi||0)-(S.fx[b].gi||0))}
function mergeGrp(g){
  const ids=grpIds(g);if(ids.length<2)return;
  const fs=ids.map(k=>S.fx[k]);const first=fs[0];
  const parts=[];
  for(const f of fs)for(const r of f.parts){const l=parts[parts.length-1];
    if(l&&Math.abs(l.x-r.x)<.6&&Math.abs(l.w-r.w)<.6&&(Math.abs(l.y-(r.y+r.h))<.6||Math.abs(r.y-(l.y+l.h))<.6)){const y=Math.min(l.y,r.y);l.h=r1(Math.max(l.y+l.h,r.y+r.h)-y);l.y=y}
    else if(l&&Math.abs(l.y-r.y)<.6&&Math.abs(l.h-r.h)<.6&&(Math.abs(l.x-(r.x+r.w))<.6||Math.abs(r.x-(l.x+l.w))<.6)){const x=Math.min(l.x,r.x);l.w=r1(Math.max(l.x+l.w,r.x+r.w)-x);l.x=x}
    else parts.push({...r})}

function setProp(id,k,v){

      if(from==='pool')moveItem(drag,{pool:true,before:t?+t.dataset.ix:null});

function moveItem(src,dst){
  // src {from,fid,idx} dst {fid,shelf,before} | {pool,before}
  const sId=src.from==='pool'?'__pool':src.fid, dId=dst.pool?'__pool':dst.fid;
  if(sId===dId&&src.idx===dst.before&&!src.copy)return;
  const cp=src.copy&&!dst.pool;
  const getArr=id=>id==='__pool'?S.pool:S.fx[id].it;
  let label;
  commit(src.copy&&!dst.pool?'نسخ منتج':'نقل منتج',[sId,dId],()=>{
    const sa=getArr(sId),da=getArr(dId);
    const item=cp?clone(sa[src.idx]):sa[src.idx];
    let before=dst.before;
    const beforeRef=before!=null?da[before]:null;
    if(!cp)sa.splice(src.idx,1);
    if(!dst.pool){const f=S.fx[dId];item[0]=dst.shelf!=null?dst.shelf:Math.min(Math.max(1,item[0]),f.shelves)}
    if(beforeRef&&beforeRef!==item){da.splice(da.indexOf(beforeRef),0,item)}
    else if(dst.pool)da.push(item);
    else{let last=-1;da.forEach((x,k)=>{if(x[0]===item[0])last=k});da.splice(last+1,0,item)}
    label=dst.pool?'اتشال لـ "غير موزّع"':cp?'اتنسخ إلى '+S.fx[dId].code+' · رف '+item[0]:dId!==sId?'اتنقل إلى '+S.fx[dId].code+' · رف '+item[0]:'';
  });
  label&&toast(label);
}

function shiftItem(fid,ix,d){ // inside its own shelf: -1 one place earlier, 1 one later, -9 first, 9 last

async function processImage(src,op,name){ // src: File|url ; op: undefined|'rot'|'flip'|'trim' ; name: product name

}

const normN=s=>String(s).toLowerCase().replace(/\.(png|jpe?g|webp|gif|bmp|avif|heic)$/i,'').replace(/[_\-.]+/g,' ').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();
let NAMEIDX=null;
function matchName(fn,pref){
  const fq=normN(fn);if(!fq)return null;const toks=fq.split(' ').filter(t=>t.length>=3);
  const score=(nm)=>{const m=normN(nm);if(m===fq)return 100;if(fq.length>=5&&m.includes(fq))return 88;if(m.length>=5&&fq.includes(m))return 84;
    let hit=0;for(const t of toks)if(m.includes(t))hit++;return hit?Math.min(80,45+hit*12-(toks.length-hit)*6):0};
  let best=null,bs=0;
  for(const n of pref){const s=score(n);if(s>bs){bs=s;best=n}}
  if(bs<70){if(!NAMEIDX)NAMEIDX=[...new Set(Object.values(S.fx).flatMap(f=>f.it.map(i=>i[1])))];for(const n of NAMEIDX){const s=score(n)-5;if(s>bs){bs=s;best=n}}}
  return bs>=55?best:null;

    const opts=n=>`<option value="">— تجاهل —</option>`+(n&&!pref.includes(n)?`<option value="${esc(n)}" selected>${esc(n)}</option>`:'')+pref.map(p=>`<option value="${esc(p)}"${p===n?' selected':''}>${esc(p)}</option>`).join('');
    dialog({title:`⬆ رفع ${files.length} صورة`,body:`<p class="meta" style="margin:0 0 8px">ربطت كل صورة بالصنف الأقرب لاسم الملف. راجع الربط وغيّره لو محتاج، وبعدين اضغط «رفع وربط».</p>
      <div style="max-height:52vh;overflow:auto"><table class="bulk">${rows.map((r,k)=>`<tr><td style="width:44px"><img src="${r.url}"></td><td><div class="meta" style="font-size:11px;word-break:break-all">${esc(r.fl.name)}</div><select data-bk="${k}" style="width:100%">${opts(r.m)}</select></td></tr>`).join('')}</table></div>
      <div class="meta" style="margin-top:6px">${rows.filter(r=>r.m).length} من ${rows.length} اتربطوا تلقائياً</div>`,
      btns:[['رفع وربط','pri',()=>{const sel=[...$$('[data-bk]')].map(s=>s.value);(async()=>{
          const out={};let k=0;for(const r of rows){const nm=sel[k++];if(!nm)continue;toast(`⏳ رفع ${k} من ${rows.length}…`);try{out[nm]={z:1,x:0,y:0,fit:'contain',wb:false,hs:1,...(await processImage(r.fl,undefined,nm))}}catch(e){console.warn('img fail',r.fl.name,e&&e.message||e)}}
          rows.forEach(r=>URL.revokeObjectURL(r.url));
          const n=Object.keys(out).length;if(!n)return toast('مفيش صور اتربطت');
          commit(`رفع ${n} صورة`,['__img'],()=>{Object.assign(S.img,out)});toast(`✓ اتربطت ${n} صورة بالأصناف`)})()}],['إلغاء']]});
  };
  inp.click();
}

/* ================= tabs ================= */
function tab(t){$$('.tabs button').forEach(b=>b.classList.toggle('act',b.dataset.t===t));$$('.pane').forEach(p=>p.classList.toggle('act',p.id==='p-'+t));
  if(t==='fx')renderPanel();if(t==='pool')renderPool();if(t==='sum')renderSum();if(t==='colors')renderColors();if(t==='find')setTimeout(()=>$('#q').focus())}
$$('.tabs button').forEach(b=>{b.onclick=()=>tab(b.dataset.t);
  b.addEventListener('dragover',e=>{if(drag&&b.dataset.t==='pool'&&drag.from!=='pool'){e.preventDefault();b.classList.add('on')}});
  b.addEventListener('dragleave',()=>b.classList.remove('on'));
  b.addEventListener('drop',e=>{b.classList.remove('on');if(drag&&b.dataset.t==='pool'&&drag.from==='fx'){e.preventDefault();toPool(drag.fid,drag.idx)}});
});

/* ================= dialog ================= */
function dialog({title,body,btns}){
  const d=$('#dlg');$('#dlgHd').textContent=title;$('#dlgBd').innerHTML=body;const ft=$('#dlgFt');ft.innerHTML='';
  for(const[txt,cls,fn]of btns){const b=document.createElement('button');b.type='button';b.textContent=txt;if(cls)b.className=cls;b.onclick=()=>{const r=fn&&fn();if(r!==false)d.close()};ft.appendChild(b)}
  d.showModal();const f=$('#dlgBd input,#dlgBd select');f&&f.focus();
}
$('#dlgForm').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('#dlgFt button').click()}});

/* ================= keyboard ================= */
addEventListener('keydown',e=>{
  const tg=e.target.tagName;const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.target.isContentEditable||$('#dlg').open;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();return}
  if(e.key==='Escape'&&$('#ctx')&&$('#ctx').style.display==='block'){ctxHide();return}
  if(mod&&(e.key.toLowerCase()==='c'||e.key==='ؤ')&&hov&&hov.it&&!String(getSelection()||'')){const a=hov.pool?S.pool:(S.fx[hov.fid]||{}).it||[];const k=a.indexOf(hov.it);if(k>=0){e.preventDefault();copyItem(hov.pool?null:hov.fid,k)}return}
  if(mod&&(e.key.toLowerCase()==='v'||e.key==='ر')&&clip&&hovZ&&S.fx[hovZ.fid]){e.preventDefault();pasteItem(hovZ.fid,hovZ.shelf,null);return}
  if(floorMode&&(e.key==='Delete'||e.key==='Backspace')){if(selA!=null){e.preventDefault();delArea(selA)}return}
  if(e.key==='Delete'||e.key==='Backspace'){if(sel.size){e.preventDefault();delSel()}return}
  if(e.key==='r'||e.key==='R'||e.key==='ق'){rotSel();return}
  if(e.key==='Escape'){if(floorMode){setFloorMode(false);return}if(elevOpen&&!sel.size){closeElev();return}sel.clear();drawSel();return}
  const ar={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(ar&&sel.size){e.preventDefault();const st=e.shiftKey?M:(snap?6:1);const ids=[...sel];
    // merge consecutive nudges into one undo step
    const last=undoS[undoS.length-1];const merge=last&&last.nudge&&last.ids===ids.join(',')&&Date.now()-last.t<1200;
    const before=merge?last.before:ids.map(i=>[i,snapOf(i)]);
    for(const id of ids)S.fx[id].parts=S.fx[id].parts.map(p=>({...p,x:r1(p.x+ar[0]*st),y:r1(p.y+ar[1]*st)}));
    const after=ids.map(i=>[i,snapOf(i)]);
    if(merge){last.after=after;last.t=Date.now();markDirty()}else{pushUndo({label:'تحريك',before,after,nudge:true,ids:ids.join(','),t:Date.now()})}
    afterChange(ids)}
});

/* ================= file menu ================= */
$('#bFile').onclick=e=>{e.stopPropagation();$('#mFile').classList.toggle('open')};
addEventListener('click',()=>$('#mFile').classList.remove('open'));
$('#mFile .dd').onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;$('#mFile').classList.remove('open');fileAct(a)};
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
function stateJson(){const o={...S,fx:{}};for(const[k,f]of Object.entries(S.fx)){const{_open,...rest}=f;o.fx[k]=rest}return JSON.stringify(o)}
async function download(name,data){
  try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});toast('تم التنزيل');return}}
  catch(err){if(err&&err.code==='declined')return;if(err&&!['unavailable','not_granted','capability_disabled'].includes(err.code)){toast('تعذّر التنزيل: '+(err.message||err.code));return}}
  try{const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast('التنزيل مش متاح هنا')}
}
async function fileAct(a){
  if(a==='json')return download(`planogram-backup-${stamp()}.json`,stateJson());
  if(a==='csv'){
    const rows=[['كود الستاند','المنطقة','النوع','براند الستاند','القسم','المكان','الرف','الترتيب على الرف','الصنف','البراند','السب كاتيجوري','الأوجه','الحبات','ROS/يوم','العرض سم','رقم المنتج (id)']];
    for(const f of Object.values(S.fx).sort((a,b)=>a.code.localeCompare(b.code))){const pos={};for(const i of f.it){pos[i[0]]=(pos[i[0]]||0)+1;rows.push([f.code,f.zone,f.kind,f.brand,f.dept,f.pos,i[0],pos[i[0]],i[1],i[2],i[6],i[3],i[4],i[5],i[7],i[8]??''])}}
    for(const i of S.pool)rows.push(['غير موزّع','','','','','','','',i[1],i[2],i[6],i[3],i[4],i[5],i[7],i[8]??'']);
    const csv='\ufeff'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
    return download(`planogram-${stamp()}.csv`,csv);
  }
  if(a==='svg'){
    const fx=[...lFx.children].map(g=>{const c=g.cloneNode(true);c.classList.remove('sel','hit','dim','drop');return c.outerHTML}).join('');
    const css=`.t{font-size:7px;fill:#111;font-family:Tahoma,Arial}.st{font-weight:700;fill:#fff}.lbl{font-size:11px;fill:#333;font-family:Tahoma,Arial}.sm{font-size:9px;fill:#888}.big{font-size:15px;font-weight:700;font-family:Tahoma,Arial}.zl{font-size:12px;font-weight:700;font-family:Tahoma,Arial}.aisle{font-size:14px;fill:#607d8b;font-weight:600;font-family:Tahoma,Arial}.clash .body{stroke:#d50000;stroke-dasharray:3 2}`;
    const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 ${S.room.w+40} ${S.room.h+90}" width="${(S.room.w+40)*1.5}" height="${(S.room.h+90)*1.5}"><style>${css}</style><rect x="-20" y="-40" width="${S.room.w+40}" height="${S.room.h+90}" fill="${S.floor.canvas}"/>${$('#lImg').innerHTML}${$('#lBg').innerHTML}${$('#lArea').innerHTML.replace(/ class="area[^"]*"/g,'')}${fx}</svg>`;
    return download(`pharmacy-layout-${stamp()}.svg`,s);
  }
  if(a==='html'){
    let src=null;try{src=await (await fetch('index.html',{cache:'no-store'})).text()}catch(e){}
    if(!src||!src.includes('<script id="app">'))src=SELF_SRC0;
    if(!src){toast('تعذّر تجهيز النسخة');return}
    src=src.replace(/\n<script id="seed" type="application\/json">[^\n]*<\/script>(?=\n)/,'');
    const st=JSON.parse(stateJson());
    const ext=Object.values(st.img||{}).filter(v=>v.ref&&!String(v.ref).startsWith('data:'));
    if(ext.length){toast(`⏳ تجهيز ${ext.length} صورة للنسخة الأوفلاين…`);for(const v of ext){try{const b=await (await fetch(STORE().imageUrl(v.ref))).blob();v.ref=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(e){}}}
    const seed='<script id="se'+'ed" type="application/json">'+JSON.stringify(st).replace(/</g,'\\u003c')+'<\/script>\n';
    const at=src.indexOf('\n<script id="app">');if(at<0){toast('تعذّر تجهيز النسخة');return}
    return download(`pharmacy-planogram-editor-${stamp()}.html`,src.slice(0,at+1)+seed+src.slice(at+1));
  }
  if(a==='import')return $('#fileIn').click();
  if(a==='bgimg')return $('#imgIn').click();
  if(a==='bgclear'){S.bgImage=null;drawBg();markDirty();return}
  if(a==='reset')return dialog({title:'استرجاع آخر نسخة محفوظة؟',body:'<p>كل التعديلات اللي ما اتحفظتش هتضيع.</p>',btns:[['استرجاع','dng',()=>{lsDel(LS_KEY);load(true)}],['إلغاء']]});
}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.fx||!o.zones)throw 0;applyState(o);markDirty();toast('تم الاستيراد — اضغط حفظ علشان يتثبت')}catch(_){toast('الملف مش نسخة صالحة')}};r.readAsText(f);e.target.value=''};

/* ================= save / persistence ================= */
let canPublish=null, lsT=null, autoT=null, saving=false, autoSave=true;
function setSave(cls,txt){const s=$('#saveState');s.className=cls;s.textContent=txt}
function saveDraft(){return lsSet(LS_KEY,'{"base":'+BASE_SAVED+',"at":'+Date.now()+',"state":'+stateJson()+'}')}
// every edit: mark dirty, keep a browser draft (1.5 s) and schedule the auto-save (8 s after the last edit)
function markDirty(){dirty=true;setSave('dirty','● تعديلات غير محفوظة');clearTimeout(lsT);lsT=setTimeout(()=>{saveDraft()},1500);scheduleAutoSave()}
function scheduleAutoSave(){clearTimeout(autoT);if(canPublish&&autoSave)autoT=setTimeout(()=>{if(dirty&&!act&&!$('#dlg').open)saveNow()},AUTOSAVE_MS)}
const AUTOSAVE_MS=45000;   // on the pharmacy's own backend: saves are counted, so the auto-save waits 45 s after the last edit
async function saveNow(){
  if(saving)return;
  if(!canPublish){
    saveDraft();
    setSave('ok','✓ محفوظ على الجهاز ده');dirty=false;
    toast(canPublish===false?'الحفظ أونلاين مش متاح هنا — اتحفظ في المتصفح. نزّل نسخة من قائمة "ملف" للأمان':'اتحفظ في المتصفح');
    return;
  }
  saving=true;setSave('','⏳ جاري الحفظ…');
  S.savedAt=Date.now();
  try{
    await STORE().save(JSON.parse(stateJson()));
    BASE_SAVED=S.savedAt;dirty=false;lsDel(LS_KEY);setSave('ok','✓ محفوظ');toast('اتحفظ ✓');
  }catch(err){
    const c=err&&err.code;
    if(c==='offline'||c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){canPublish=false;saveDraft();setSave('err','وضع القراءة فقط');toast('مش عندك صلاحية الحفظ هنا — التعديلات محفوظة في المتصفح بس')}
    else if(c==='conflict'){try{sessionStorage.setItem(LS_KEY+'-c','1')}catch(_){}setSave('err','في نسخة أحدث — جاري التحديث');}
    else{setSave('err','✕ فشل الحفظ');toast('فشل الحفظ: '+((err&&err.message)||c||'خطأ')+' — التعديلات لسه في المتصفح')}
  }finally{saving=false}
}
$('#bSave').onclick=saveNow;
$('#bAuto').onclick=e=>{autoSave=!autoSave;e.currentTarget.classList.toggle('on',autoSave);toast(autoSave?'الحفظ التلقائي شغال':'الحفظ التلقائي متوقف — استخدم زر حفظ')};
addEventListener('beforeunload',e=>{if(dirty){saveDraft();}});

function applyState(o){
  S=o;S.pool=S.pool||[];S.zones=S.zones||{};S.room=S.room||{w:1056,h:1106.4};S.floor={...FLOOR0,...(S.floor||{})};S.areas=S.areas||[];S.img=S.img||{};
  for(const v of Object.values(S.img)){if(v.u!=null&&v.ref==null)v.ref=v.u;delete v.u}
  selA=null;if(floorMode)setFloorMode(false);
  sel.clear();cur=null;undoS=[];redoS=[];updUndo();
  drawBg();drawLegend();drawAll();renderTotals();renderPanel();renderPool();
  if($('#p-sum').classList.contains('act'))renderSum();
  renderColors();renderElev();
}
async function load(skipDraft){
  let o=null;
  if(!o){try{o=await STORE().load()}catch(e){console.error('PG_STORE.load failed',e)}}
  if(!o){$('#loading').textContent='تعذّر تحميل بيانات المخطط.';return}
  BASE_SAVED=o.savedAt||0;
  applyState(o);fit();setSave('ok','✓ محفوظ');dirty=false;
  $('#loading').style.display='none';
  if(!skipDraft){
    let d=null;try{d=JSON.parse(lsGet(LS_KEY)||'null')}catch(e){}
    if(d&&d.state&&d.at>BASE_SAVED){
      $('#bannerTxt').textContent='في تعديلات محفوظة في المتصفح ده من '+new Date(d.at).toLocaleString('ar-EG')+' ما اتحفظتش أونلاين.';
      const b=$('#banner');b.style.display='flex';
      $('#bannerYes').onclick=()=>{b.style.display='none';applyState(d.state);markDirty();toast('اتسترجعت — اضغط حفظ')};
      $('#bannerNo').onclick=()=>{b.style.display='none';lsDel(LS_KEY)};
    }
  }
}
(async()=>{
  await load(false);
  try{const st=STORE();if(st.init)await st.init();canPublish=st.online!==false}catch(e){canPublish=false}
  if(!canPublish){$('#bSave').textContent='💾 حفظ في المتصفح';$('#bAuto').style.display='none'}
})();
})();
</script>
