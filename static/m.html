<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>صيدلية اي براند 360°</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
:root{
  --pink:#e873a8; --pink-deep:#c9518b; --pink-soft:#fbe3ef; --plum:#3b1d36;
  --ink:#2b2230; --line:#f0d8e4; --font:"Almarai", Tahoma, "Segoe UI", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; background:#fff; font-family:var(--font); color:var(--ink)}
#stage{position:fixed; inset:0; touch-action:none}
#stage canvas{display:block}
#fade{position:fixed; inset:0; background:#fff; opacity:1; transition:opacity .45s; pointer-events:none; z-index:3}

.topbar{position:fixed; z-index:6; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px; left:12px; display:flex; gap:8px; align-items:center; justify-content:space-between; pointer-events:none}
.brand{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:16px; padding:7px 12px; box-shadow:0 8px 22px rgba(59,29,54,.14); pointer-events:auto}
.brand img{height:30px}
.brand .t{font-weight:800; color:var(--pink-deep); font-size:15px; line-height:1.15}
.brand .t small{display:block; font-weight:700; color:#9a7f8f; font-size:10.5px}
.tbtn{position:relative; display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:15px; border:1px solid var(--line); background:rgba(255,255,255,.94); box-shadow:0 8px 22px rgba(59,29,54,.14); pointer-events:auto}
.tbtn svg{width:21px; height:21px; color:var(--pink-deep)}
#cartBtn{background:var(--pink); border-color:var(--pink)}
#cartBtn svg{color:#fff}
#cartCount{position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; border-radius:10px; background:var(--plum); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px}

.hintTop{position:fixed; z-index:4; top:calc(env(safe-area-inset-top,0px) + 70px); left:50%; transform:translateX(-50%); background:rgba(59,29,54,.82); color:#fff; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; pointer-events:none; transition:opacity .6s}

.nav{position:fixed; z-index:5; top:50%; transform:translateY(-50%); width:46px; height:64px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.92); border:1px solid var(--line); box-shadow:0 8px 22px rgba(59,29,54,.16)}
.nav svg{width:22px; height:22px; color:var(--pink-deep)}
#prevS{right:0; border-radius:16px 0 0 16px / 20px 0 0 20px; border-right:0}
#nextS{left:0; border-radius:0 16px 16px 0 / 0 20px 20px 0; border-left:0}

.bottom{position:fixed; z-index:6; left:0; right:0; bottom:0; padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; flex-direction:column; gap:9px; background:linear-gradient(transparent, rgba(255,255,255,.92) 55%); pointer-events:none}
#shopBtn{pointer-events:auto; margin:0 auto; display:flex; align-items:center; gap:8px; background:var(--pink); color:#fff; border:0; border-radius:999px; font:800 15px var(--font); padding:13px 26px; box-shadow:0 12px 28px rgba(201,81,139,.4)}
.chips{pointer-events:auto; display:flex; gap:7px; overflow-x:auto; padding:4px 2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1px solid var(--line); background:rgba(255,255,255,.95); color:var(--ink); border-radius:999px; font:700 12.5px var(--font); padding:9px 14px}
.chip.on{background:var(--plum); color:#fff; border-color:var(--plum)}

.sheet{position:fixed; z-index:8; left:0; right:0; bottom:0; top:18%; background:#fff; border-radius:22px 22px 0 0; box-shadow:0 -14px 40px rgba(59,29,54,.3); display:flex; flex-direction:column; transform:translateY(103%); transition:transform .32s cubic-bezier(.2,.8,.25,1)}
.sheet.open{transform:translateY(0)}
.sh{display:flex; align-items:center; gap:10px; padding:12px 16px 8px}
.sh b{font-size:16px; color:var(--plum)}
.sh .x{margin-right:auto; width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:#fff; font:800 16px var(--font); color:#9a7f8f}
.searchRow{padding:0 16px 8px}
.searchRow input{width:100%; border:1.5px solid var(--line); border-radius:13px; padding:11px 14px; font:700 14px var(--font); background:#fdf7fa; outline:none}
.searchRow input:focus{border-color:var(--pink)}
.tabs{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 10px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:999px; font:700 12.5px var(--font); color:var(--ink); padding:8px 14px}
.tab.on{background:var(--pink); border-color:var(--pink); color:#fff}
#grid{flex:1; overflow-y:auto; padding:4px 12px 20px; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; overscroll-behavior:contain}
.card{border:1px solid var(--line); border-radius:16px; background:#fff; padding:9px; display:flex; flex-direction:column; gap:6px}
.card .ph{position:relative; width:100%; aspect-ratio:1; border-radius:12px; background:#fdf7fa; overflow:hidden}
.card .ph img{width:100%; height:100%; object-fit:contain}
.card .off{position:absolute; top:6px; right:6px; background:#d92b3a; color:#fff; font:800 10.5px var(--font); border-radius:999px; padding:3px 8px}
.card .nm{font-size:12px; font-weight:700; line-height:1.45; height:2.9em; overflow:hidden}
.card .pr{display:flex; align-items:baseline; gap:7px}
.card .pr b{color:var(--pink-deep); font-size:15px}
.card .pr b small{font-size:10px; font-weight:800}
.card .pr s{color:#b49aa8; font-size:11.5px}
.card .add{display:flex; align-items:center; gap:8px}
.card .add button{flex:1; border:0; border-radius:11px; background:var(--pink); color:#fff; font:800 13px var(--font); padding:10px 0}
.card .add button.inCart{background:var(--plum)}
.more{grid-column:1 / -1; text-align:center; color:#9a7f8f; font:700 13px var(--font); padding:12px}

.item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.item img{width:52px; height:52px; object-fit:contain; border-radius:10px; background:#fdf7fa}
.item .nm{flex:1; font-size:12.5px; font-weight:700; line-height:1.4}
.item .nm b{display:block; color:var(--pink-deep); margin-top:2px}
.qty{display:flex; align-items:center; gap:8px}
.qty button{width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:#fff; font:800 15px var(--font); color:var(--pink-deep)}
.qty span{min-width:18px; text-align:center; font-weight:800}
#cartFoot{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px); border-top:1px solid var(--line)}
#cartFoot .tot{display:flex; justify-content:space-between; font-weight:800; margin-bottom:10px}
#cartFoot .go{width:100%; border:0; border-radius:14px; background:var(--pink); color:#fff; font:800 15px var(--font); padding:14px 0}
#cartFoot .go small{display:block; font-weight:700; font-size:11px; opacity:.9}
#cartBody{flex:1; overflow-y:auto; padding:0 16px}
.empty{text-align:center; color:#9a7f8f; font-weight:700; padding:40px 10px; line-height:2}

#toast{position:fixed; z-index:9; bottom:calc(env(safe-area-inset-bottom,0px) + 120px); left:50%; transform:translateX(-50%); background:var(--plum); color:#fff; font:700 13px var(--font); padding:10px 18px; border-radius:999px; box-shadow:0 10px 26px rgba(59,29,54,.35); white-space:nowrap}
#loading{position:fixed; inset:0; z-index:10; background:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-weight:800; color:var(--pink-deep)}
#loading img{height:72px}
.spin{width:34px; height:34px; border-radius:50%; border:4px solid var(--pink-soft); border-top-color:var(--pink); animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="topbar">
  <button class="tbtn" id="cartBtn" type="button" aria-label="السلة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2l2.4 11.2A1.6 1.6 0 0 0 9 16.5h8.2a1.6 1.6 0 0 0 1.56-1.22L20.6 8H6.1"/></svg><span id="cartCount" hidden>0</span></button>
  <div class="brand"><div class="t">صيدلية اي براند<small>جولة 360° • تسوّق من جوالك</small></div><img src="assets/logo.png" alt="اي براند" onerror="this.remove()"></div>
</div>

<div class="hintTop" id="hint">اسحب لتلفّ حولك 360° • الأسهم تنقلك بين الممرات</div>

<button class="nav" id="prevS" type="button" aria-label="الموقف السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
<button class="nav" id="nextS" type="button" aria-label="الموقف التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>

<div class="bottom">
  <button id="shopBtn" type="button"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7V6a6 6 0 0 1 12 0v1h2l-1 14H5L4 7h2z"/></svg><span id="shopLbl">تسوّق هذا الممر</span></button>
  <div class="chips" id="chips"></div>
</div>

<div class="sheet" id="shop">
  <div class="sh"><b id="shopTitle">تسوّق</b><button class="x" type="button" data-close="shop">✕</button></div>
  <div class="searchRow"><input id="q" type="search" placeholder="ابحث في كل المنتجات… (مثال: سيروم، بامبرز)" autocomplete="off"></div>
  <div class="tabs" id="tabs"></div>
  <div id="grid"></div>
</div>

<div class="sheet" id="cart">
  <div class="sh"><b>سلتك 🛒</b><button class="x" type="button" data-close="cart">✕</button></div>
  <div id="cartBody"></div>
  <div id="cartFoot" hidden>
    <div class="tot"><span>الإجمالي</span><span id="cartTotal"></span></div>
    <button class="go" id="goCheckout" type="button">إتمام الطلب من المتجر<small>تنتقل منتجاتك لسلة ibrand.com.sa</small></button>
  </div>
</div>

<div id="toast" hidden></div>
<div id="loading"><img src="assets/logo.png" alt="" onerror="this.remove()"><div class="spin"></div><div>جاري فتح الصيدلية…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';
const $ = s => document.querySelector(s);
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const money = v => v.toFixed(2).replace(/\.00$/, '') + ' ر.س';
let toastT = null; const toast = t => { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400); };

// ---------- data ----------
let DATA = null, STOPS = null;
try {
  [DATA, STOPS] = await Promise.all([
    fetch('data/products.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()),
    fetch('panos/stops.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json())
  ]);
} catch(e){ $('#loading').innerHTML = '<div style="padding:30px;text-align:center;font-weight:700">تعذر تحميل بيانات الصيدلية — تأكد من اتصالك وأعد المحاولة</div>'; return; }
const IMGB = DATA.imgBase || '', URLB = DATA.storeUrl || 'https://ibrand.com.sa/ar/';
const full = (s, b) => s && s.startsWith('http') ? s : b + (s || '');
const secProducts = k => (DATA.sections[k] && DATA.sections[k].products) || [];
const stops = STOPS.stops, secNames = STOPS.secNames || {};

// ---------- cart (shared with the 3D page; checkout moves it to ibrand.com.sa) ----------
let cart = store.get('ib3d-cart', {});
const cartCount = () => Object.values(cart).reduce((a, it) => a + it.qty, 0);
const cartTotal = () => Object.values(cart).reduce((a, it) => a + (it.price || 0) * it.qty, 0);
function saveCart(){ store.set('ib3d-cart', cart); const n = cartCount(), b = $('#cartCount'); b.textContent = n; b.hidden = !n; renderCart(); }
function addToCart(p){
  const cur = cart[p.id] || {id: p.id, name: p.name, price: p.price, img: full(p.img, IMGB), url: full(p.url, URLB), qty: 0};
  cur.qty = Math.min(10, cur.qty + 1); cur.price = p.price; cart[p.id] = cur; saveCart();
  toast('أضفناه لسلتك ✓');
}
function renderCart(){
  const box = $('#cartBody'); box.innerHTML = '';
  const items = Object.values(cart);
  if (!items.length) box.innerHTML = '<div class="empty">سلتك فاضية.<br>افتح «تسوّق هذا الممر» وأضف منتجاتك.</div>';
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'item';
    const img = document.createElement('img'); img.src = it.img; img.alt = ''; img.loading = 'lazy'; row.appendChild(img);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    const pr = document.createElement('b'); pr.textContent = it.price ? money(it.price * it.qty) : ''; nm.appendChild(pr); row.appendChild(nm);
    const q = document.createElement('div'); q.className = 'qty';
    const mk = (t, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = fn; return b; };
    const sp = document.createElement('span'); sp.textContent = it.qty;
    q.append(mk('−', () => { it.qty--; if (it.qty <= 0) delete cart[it.id]; saveCart(); }), sp, mk('+', () => { it.qty = Math.min(10, it.qty + 1); saveCart(); }));
    row.appendChild(q); box.appendChild(row);
  });
  $('#cartTotal').textContent = money(cartTotal());
  $('#cartFoot').hidden = !items.length;
}
$('#goCheckout').addEventListener('click', () => {
  if (!cartCount()) return toast('سلتك فاضية');
  const items = Object.values(cart).map(it => it.id + ':' + it.qty).join(',');
  window.open('https://ibrand.com.sa/ar/cart#ib3d=' + items, '_blank', 'noopener');
  toast('فتحنا سلتك في المتجر');
});

// ---------- pano viewer ----------
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, .1, 110);
const sphere = new THREE.Mesh(new THREE.SphereGeometry(60, 56, 36), new THREE.MeshBasicMaterial({color: 0xffffff}));
sphere.geometry.scale(-1, 1, 1);
scene.add(sphere);
const texLoader = new THREE.TextureLoader();
const texCache = {};
function loadPano(id){
  return texCache[id] || (texCache[id] = new Promise(res => texLoader.load('panos/' + id + '.jpg', t => { t.encoding = THREE.sRGBEncoding; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; res(t); })));
}
let yaw = 0, pitch = 0, fov = 78, idx = 0;
async function go(i, first){
  idx = (i + stops.length) % stops.length;
  const st = stops[idx];
  if (!first){ $('#fade').style.opacity = 1; await new Promise(r => setTimeout(r, 330)); }
  const t = await loadPano(st.id);
  sphere.material.map = t; sphere.material.color.set(0xffffff); sphere.material.needsUpdate = true;
  yaw = 0; pitch = 0; fov = 78;
  $('#fade').style.opacity = 0;
  document.querySelectorAll('.chip').forEach((c, j) => { c.classList.toggle('on', j === idx); if (j === idx) c.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'}); });
  $('#shopLbl').textContent = st.secs.length ? 'تسوّق: ' + st.secs.map(k => secNames[k] || k).join(' و') : 'تسوّق الصيدلية';
  const nb = stops[(idx + 1) % stops.length], pb = stops[(idx - 1 + stops.length) % stops.length];
  loadPano(nb.id); loadPano(pb.id);
}
stops.forEach((st, i) => {
  const c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
  c.textContent = st.secs.length ? st.name + ' · ' + st.secs.map(k => secNames[k] || k).join('، ') : st.name;
  c.onclick = () => go(i);
  $('#chips').appendChild(c);
});
$('#nextS').onclick = () => go(idx + 1);
$('#prevS').onclick = () => go(idx - 1);

// drag look + pinch zoom + inertia
let dragging = false, px = 0, py = 0, vyaw = 0, vpitch = 0, pinch0 = 0, fov0 = 78;
const pts = new Map();
stage.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); if (pts.size === 1){ dragging = true; px = e.clientX; py = e.clientY; vyaw = vpitch = 0; } else if (pts.size === 2){ dragging = false; const a = [...pts.values()]; pinch0 = Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY); fov0 = fov; } stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2){ const a = [...pts.values()]; const d = Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY); fov = Math.max(48, Math.min(95, fov0 * pinch0 / Math.max(40, d))); return; }
  if (!dragging) return;
  const k = (fov / 78) * 0.0042;
  vyaw = (e.clientX - px) * k; vpitch = (e.clientY - py) * k;
  yaw -= vyaw; pitch = Math.max(-1.25, Math.min(1.25, pitch - vpitch));
  px = e.clientX; py = e.clientY;
  $('#hint').style.opacity = 0;
});
const endP = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; if (!pts.size) dragging = false; };
stage.addEventListener('pointerup', endP); stage.addEventListener('pointercancel', endP);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
(function loop(){
  requestAnimationFrame(loop);
  if (!dragging){ yaw -= vyaw; pitch = Math.max(-1.25, Math.min(1.25, pitch - vpitch)); vyaw *= .93; vpitch *= .93; }
  camera.fov += (fov - camera.fov) * .25; camera.updateProjectionMatrix();
  camera.lookAt(Math.sin(yaw + Math.PI) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw + Math.PI) * Math.cos(pitch));
  renderer.render(scene, camera);
})();

// ---------- shop sheet ----------
const grid = $('#grid'), tabs = $('#tabs');
let curList = [], shown = 0;
const CHUNK = 40;
function card(p){
  const el = document.createElement('div'); el.className = 'card';
  const ph = document.createElement('div'); ph.className = 'ph';
  const img = document.createElement('img'); img.loading = 'lazy'; img.src = full(p.img, IMGB); img.alt = '';
  img.onerror = () => { img.remove(); };
  ph.appendChild(img);
  if (p.onSale && p.regular && p.regular > p.price){ const o = document.createElement('span'); o.className = 'off'; o.textContent = '-' + Math.round((1 - p.price / p.regular) * 100) + '%'; ph.appendChild(o); }
  el.appendChild(ph);
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.name; el.appendChild(nm);
  const pr = document.createElement('div'); pr.className = 'pr';
  const b = document.createElement('b'); const [ri, hal] = (p.price || 0).toFixed(2).split('.');
  b.innerHTML = ri + (hal !== '00' ? '<small>.' + hal + '</small>' : '') + ' <small>ر.س</small>'; pr.appendChild(b);
  if (p.onSale && p.regular && p.regular > p.price){ const s = document.createElement('s'); s.textContent = p.regular.toFixed(2); pr.appendChild(s); }
  el.appendChild(pr);
  const add = document.createElement('div'); add.className = 'add';
  const btn = document.createElement('button'); btn.type = 'button';
  const sync = () => { const q = cart[p.id] && cart[p.id].qty; btn.textContent = q ? '✓ في السلة (' + q + ') — أضف' : '+ أضف للسلة'; btn.classList.toggle('inCart', !!q); };
  btn.onclick = () => { addToCart(p); sync(); };
  sync(); add.appendChild(btn); el.appendChild(add);
  return el;
}
function renderChunk(){
  const end = Math.min(curList.length, shown + CHUNK);
  for (; shown < end; shown++) grid.appendChild(card(curList[shown]));
  const old = grid.querySelector('.more'); if (old) old.remove();
  if (shown < curList.length){
    const m = document.createElement('div'); m.className = 'more'; m.textContent = 'عرض المزيد… (' + (curList.length - shown) + ')';
    m.onclick = renderChunk; grid.appendChild(m); io.observe(m);
  }
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); renderChunk(); } }), {root: grid, rootMargin: '300px'});
function showList(list){ curList = list; shown = 0; grid.innerHTML = ''; grid.scrollTop = 0; renderChunk(); }
function openShop(){
  const st = stops[idx];
  const secs = st.secs.length ? st.secs : (DATA.mainKeys || Object.keys(DATA.sections));
  $('#shopTitle').textContent = st.name;
  tabs.innerHTML = '';
  secs.forEach((k, j) => {
    const t = document.createElement('button'); t.type = 'button'; t.className = 'tab' + (j === 0 ? ' on' : '');
    t.textContent = (secNames[k] || k) + ' (' + secProducts(k).length + ')';
    t.onclick = () => { tabs.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on'); $('#q').value = ''; showList(secProducts(k)); };
    tabs.appendChild(t);
  });
  showList(secProducts(secs[0]));
  $('#shop').classList.add('open');
}
$('#shopBtn').onclick = openShop;
let allP = null;
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim();
  if (!q){ const on = tabs.querySelector('.tab.on'); if (on) on.click(); return; }
  if (!allP){ allP = []; (DATA.mainKeys || Object.keys(DATA.sections)).forEach(k => allP.push(...secProducts(k))); }
  const ql = q.toLowerCase();
  showList(allP.filter(p => p.name && p.name.toLowerCase().includes(ql)).slice(0, 300));
});
$('#cartBtn').onclick = () => { renderCart(); $('#cart').classList.add('open'); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('open'));

// ---------- start ----------
saveCart();
await go(0, true);
$('#loading').style.opacity = 0; $('#loading').style.transition = 'opacity .5s'; setTimeout(() => $('#loading').hidden = true, 520);
setTimeout(() => { $('#hint').style.opacity = 0; }, 6000);
})();
</script>
