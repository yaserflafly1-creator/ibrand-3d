name: Refresh products and deploy

on:
  workflow_dispatch:
  push:
    branches: [ibrand-dashboard]
  schedule:
    - cron: '17 0 * * *'   # daily, 03:17 Riyadh

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore product photo cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tiles6
          key: tiles6-${{ github.run_id }}
          restore-keys: tiles6-
      - run: npm install --no-save sharp@0.33.5
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
          cp -r static/. site/ 2>/dev/null || true
      - name: Pull products from the store
        run: node scripts/build-data.mjs
      - name: Save product photo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tiles6
          key: tiles6-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear a stuck earlier deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $( (gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha'; echo fdb8fd118c361dc506296bdbbf07fc52d9a9f741) | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done
      - id: deployment
        uses: actions/deploy-pages@v4
