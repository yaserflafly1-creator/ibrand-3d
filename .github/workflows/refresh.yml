name: Refresh products and deploy

on:
  workflow_dispatch:
  push:
    branches: [ibrand-dashboard]
  schedule:
    - cron: '17 0 * * *'   # daily, 03:17 Riyadh

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore product photo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/tiles8
            .cache/basis6
          key: tiles8-${{ github.run_id }}
          restore-keys: tiles8-
      - name: Cache basisu encoder
        id: basisu-cache
        uses: actions/cache@v4
        with:
          path: .tools/basisu
          key: basisu-1.16.4-${{ runner.os }}
      - name: Build basisu encoder if missing
        if: steps.basisu-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.16.4 https://github.com/BinomialLLC/basis_universal.git /tmp/bu
          cmake -S /tmp/bu -B /tmp/bu/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/bu/build -j
          mkdir -p .tools
          cp "$(find /tmp/bu -name basisu -type f | head -1)" .tools/basisu
          chmod +x .tools/basisu
      - run: npm install --no-save sharp@0.33.5
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
          cp -r static/. site/ 2>/dev/null || true
          echo "${{ github.run_id }}" > site/build.txt
      - name: Pull products from the store
        run: node scripts/build-data.mjs
        env:
          BASISU: ${{ github.workspace }}/.tools/basisu
      - name: Save product photo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/tiles8
            .cache/basis6
          key: tiles8-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear a stuck earlier deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $( (gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha'; echo fdb8fd118c361dc506296bdbbf07fc52d9a9f741) | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done
      - id: deployment
        uses: actions/deploy-pages@v4
      # the repository also has a branch-based Pages build; when it shares this commit the deploy above can report
      # success without going live, leaving the bare branch (no product data) online. Check, and deploy again if so.
      - name: Check that this build is what is live
        id: check
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          sleep 25
          for i in $(seq 1 24); do
            if [ "$(curl -fsS "${URL}build.txt?x=$RANDOM$i" 2>/dev/null | tr -d '[:space:]')" = "${{ github.run_id }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Deploy again if the first attempt did not take
        if: steps.check.outputs.ok != 'true'
        uses: actions/deploy-pages@v4
      - name: Fail loudly if this build is still not live
        if: steps.check.outputs.ok != 'true'
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          sleep 25
          for i in $(seq 1 24); do
            if [ "$(curl -fsS "${URL}build.txt?y=$RANDOM$i" 2>/dev/null | tr -d '[:space:]')" = "${{ github.run_id }}" ]; then exit 0; fi
            sleep 10
          done
          echo "this build is not live"; exit 1
