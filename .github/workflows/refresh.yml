name: Refresh products and deploy

on:
  workflow_dispatch:
  push:
    branches: [ibrand-dashboard]
  schedule:
    - cron: '17 0 * * *'   # daily, 03:17 Riyadh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore product photo cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tiles
          key: tiles-${{ github.run_id }}
          restore-keys: tiles-
      - run: npm install --no-save sharp@0.33.5
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
          cp -r static/. site/ 2>/dev/null || true
      - name: Pull products from the store
        run: node scripts/build-data.mjs
      - name: Save product photo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tiles
          key: tiles-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
